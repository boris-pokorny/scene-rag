[project]
name = "scene-rag-retrieval"
version = "0.1.0"
description = "scene-rag retrieval service: chunking and embedding steps; query-api role"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "pymongo>=4.17",
]

[project.optional-dependencies]
# Per-step and per-role extras, as in extraction: the image installs them all, a process imports
# only its own. Chunking needs nothing beyond the base dependencies.

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "mypy>=1.19",
    "jsonschema>=4",
    "hypothesis>=6",
    "pytest-cov>=6",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.build]
package-dir = "src"
includes = ["src/scene_rag"]

[tool.pdm.scripts]
# Load this service's .env for every `pdm run`; real environment variables win.
_.env_file = ".env"
lint = { composite = [
    "ruff check src tests",
    "ruff format --check src tests",
] }
format = "ruff format src tests"
typecheck = "mypy"
test = "pytest --cov"
# Only the MongoDB cases; a subset cannot meet the coverage threshold, so no coverage here.
test-integration = "pytest -m integration --no-cov"
worker = "python -m scene_rag.retrieval worker"

[tool.ruff]
line-length = 100
src = ["src", "."]
extend-exclude = ["__pypackages__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "jsonschema",
    "jsonschema.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["scene_rag.retrieval"]
branch = true

[tool.coverage.report]
fail_under = 95
exclude_also = ["if __name__ == .__main__.:"]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a reachable MongoDB at SCENE_RAG_RETRIEVAL_CHUNK_STORE_URI",
]
