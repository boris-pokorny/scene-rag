# A fully wired scene-rag instance: MongoDB for the stores, Ollama for the vision and
# embedding models, Qdrant for the Search Index, the three extraction workers polling in a
# loop, the scene-api role on localhost:${SCENE_API_PORT:-8080}, and the retrieval service's
# chunking and embedding workers and its query-api role on localhost:${QUERY_API_PORT:-8081}
# (REST routes and the MCP transport at /mcp). Drop media into extraction/data/media/.
#
# Each image's own pull-models role pulls the models its configs name: extraction's the vision
# model (enrichment config), retrieval's the embedding model (embedding config) and the
# generator (query-api config).
#
# Paths inside file:// URIs cross containers: ingestion records /data/media/..., segmentation
# reads it there and files derivatives under /data/derivatives, which enrichment and scene-api
# read back. Every container therefore mounts those volumes at the same absolute path.
#
# extraction/.env is a `pdm run` feature and is not read here; every setting is explicit.
# `${VAR:-default}` values can be overridden from the shell or a .env next to this file.
#
# Hosts with an NVIDIA GPU add the override: `docker compose -f compose.yaml -f compose.gpu.yaml up`.
name: scene-rag

x-extraction: &extraction
  build: ./extraction
  image: scene-rag-extraction
  restart: unless-stopped
  environment: &extraction-env
    SCENE_RAG_EXTRACTION_REGISTRY_URI: mongodb://mongo:27017
    SCENE_RAG_EXTRACTION_REGISTRY_DATABASE: scene_rag_extraction
    SCENE_RAG_EXTRACTION_SCENE_STORE_URI: mongodb://mongo:27017
    SCENE_RAG_EXTRACTION_SCENE_STORE_DATABASE: scene_rag_extraction
    SCENE_RAG_EXTRACTION_ENRICHMENT_STORE_URI: mongodb://mongo:27017
    SCENE_RAG_EXTRACTION_ENRICHMENT_STORE_DATABASE: scene_rag_extraction
    SCENE_RAG_EXTRACTION_POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
  depends_on:
    mongo:
      condition: service_healthy

services:
  mongo:
    image: docker.io/mongo:8
    # Only on localhost, for `mongosh` and the `pdm run` flow of extraction/README.md.
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama:
    image: docker.io/ollama/ollama:0.40.12
    # Only on localhost, for the `pdm run` flow of retrieval/README.md (`worker --step
    # embedding` and `pull-models` on the host reach the same server as the containers).
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: docker.io/qdrant/qdrant:v1.20.0
    # Only on localhost, for the dashboard (/dashboard) and the `pdm run` flow of
    # retrieval/README.md.
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image ships neither curl nor wget; bash's /dev/tcp checks that the port answers.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One shot: the pull-models role puts the vision model the enrichment step's config names
  # into the ollama volume and exits 0, so the model is named nowhere in this file. Enrichment
  # waits for it, since a missing model ends that process at startup. A model already in the
  # volume is not pulled again, so a later `up` needs no network.
  ollama-pull:
    build: ./extraction
    image: scene-rag-extraction
    command: ["pull-models"]
    environment:
      SCENE_RAG_EXTRACTION_OLLAMA_URL: http://ollama:11434
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy

  ingestion:
    <<: *extraction
    command: ["worker", "--step", "ingestion"]
    environment:
      <<: *extraction-env
      SCENE_RAG_EXTRACTION_SOURCE_ROOT: /data/media
      SCENE_RAG_EXTRACTION_SOURCE_ID: ${SOURCE_ID:-local}
      SCENE_RAG_EXTRACTION_SOURCE_ENTITLEMENTS: ${SOURCE_ENTITLEMENTS:-public}
    volumes:
      - ./extraction/data/media:/data/media:ro,z

  segmentation:
    <<: *extraction
    command: ["worker", "--step", "segmentation"]
    environment:
      <<: *extraction-env
      SCENE_RAG_EXTRACTION_DERIVATIVE_ROOT: /data/derivatives
      SCENE_RAG_EXTRACTION_SEGMENTATION_WORKERS: ${SEGMENTATION_WORKERS:-1}
      SCENE_RAG_EXTRACTION_AUDIO_CLIP_WORKERS: ${AUDIO_CLIP_WORKERS:-4}
    volumes:
      - ./extraction/data/media:/data/media:ro,z
      - derivatives:/data/derivatives

  enrichment:
    <<: *extraction
    command: ["worker", "--step", "enrichment"]
    environment:
      <<: *extraction-env
      SCENE_RAG_EXTRACTION_OLLAMA_URL: http://ollama:11434
      SCENE_RAG_EXTRACTION_WHISPER_CACHE_DIR: /data/models
      SCENE_RAG_EXTRACTION_ENRICHMENT_WORKERS: ${ENRICHMENT_WORKERS:-1}
    volumes:
      - derivatives:/data/derivatives:ro
      - whisper-cache:/data/models
    depends_on:
      mongo:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  scene-api:
    <<: *extraction
    command: ["scene-api"]
    environment:
      <<: *extraction-env
      # The code default 127.0.0.1 is unreachable from outside the container.
      SCENE_RAG_EXTRACTION_SCENE_API_HOST: 0.0.0.0
      SCENE_RAG_EXTRACTION_SCENE_API_PORT: "8080"
      SCENE_RAG_EXTRACTION_SCENE_API_PAGE_SIZE: ${SCENE_API_PAGE_SIZE:-100}
    ports:
      - "${SCENE_API_PORT:-8080}:8080"
    volumes:
      - derivatives:/data/derivatives:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 6

  # The retrieval service: a separate image and a separate database on the same MongoDB. It
  # reaches Media data only through scene-api, never through the extraction collections.
  chunking:
    build: ./retrieval
    image: scene-rag-retrieval
    restart: unless-stopped
    command: ["worker", "--step", "chunking"]
    environment:
      SCENE_RAG_RETRIEVAL_SCENE_API_URL: http://scene-api:8080
      SCENE_RAG_RETRIEVAL_CHUNK_STORE_URI: mongodb://mongo:27017
      SCENE_RAG_RETRIEVAL_CHUNK_STORE_DATABASE: scene_rag_retrieval
      SCENE_RAG_RETRIEVAL_POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      SCENE_RAG_RETRIEVAL_CHUNKING_WORKERS: ${CHUNKING_WORKERS:-1}
    depends_on:
      mongo:
        condition: service_healthy
      scene-api:
        condition: service_healthy

  # The same for the embedding model and the generator, from the retrieval image and its
  # embedding and query-api configs.
  ollama-pull-retrieval:
    build: ./retrieval
    image: scene-rag-retrieval
    command: ["pull-models"]
    environment:
      SCENE_RAG_RETRIEVAL_OLLAMA_URL: http://ollama:11434
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy

  # The embedding step reads the chunk collections the chunking worker writes, embeds them
  # through Ollama and writes one Qdrant collection per embedding fingerprint, plus the index
  # ledger (index_sets, indexes) in the same retrieval database.
  embedding:
    build: ./retrieval
    image: scene-rag-retrieval
    restart: unless-stopped
    command: ["worker", "--step", "embedding"]
    environment:
      SCENE_RAG_RETRIEVAL_CHUNK_STORE_URI: mongodb://mongo:27017
      SCENE_RAG_RETRIEVAL_CHUNK_STORE_DATABASE: scene_rag_retrieval
      SCENE_RAG_RETRIEVAL_SEARCH_INDEX_URL: http://qdrant:6333
      SCENE_RAG_RETRIEVAL_OLLAMA_URL: http://ollama:11434
      SCENE_RAG_RETRIEVAL_POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      SCENE_RAG_RETRIEVAL_EMBEDDING_WORKERS: ${EMBEDDING_WORKERS:-1}
      SCENE_RAG_RETRIEVAL_EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama-pull-retrieval:
        condition: service_completed_successfully

  # The query-api role: search and answers over HTTP (POST /search, POST /answer) and MCP
  # (/mcp) on one port. It reads the index ledger, searches the Search Index, embeds queries
  # and generates answers through Ollama, and proxies scene records and keyframes from
  # scene-api. The caller's entitlements travel in the X-Scene-Rag-Entitlements header; a
  # gateway in front is expected to assert them. Until one does, any client can claim any
  # entitlement, so the port is published on loopback only.
  query-api:
    build: ./retrieval
    image: scene-rag-retrieval
    restart: unless-stopped
    command: ["query-api"]
    environment:
      SCENE_RAG_RETRIEVAL_CHUNK_STORE_URI: mongodb://mongo:27017
      SCENE_RAG_RETRIEVAL_CHUNK_STORE_DATABASE: scene_rag_retrieval
      SCENE_RAG_RETRIEVAL_SEARCH_INDEX_URL: http://qdrant:6333
      SCENE_RAG_RETRIEVAL_OLLAMA_URL: http://ollama:11434
      SCENE_RAG_RETRIEVAL_SCENE_API_URL: http://scene-api:8080
      # The code default 127.0.0.1 is unreachable from outside the container.
      SCENE_RAG_RETRIEVAL_QUERY_API_HOST: 0.0.0.0
      SCENE_RAG_RETRIEVAL_QUERY_API_PORT: "8081"
      # Host headers served: the published port and the compose network's name for it.
      SCENE_RAG_RETRIEVAL_QUERY_API_ALLOWED_HOSTS: 127.0.0.1,localhost,query-api
    ports:
      - "127.0.0.1:${QUERY_API_PORT:-8081}:8081"
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      scene-api:
        condition: service_healthy
      ollama-pull-retrieval:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  mongo-data:
  ollama-models:
  derivatives:
  whisper-cache:
  qdrant-data:
